name: Validate PBX module
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:12-slim
      # Required only for disposable test mount/network/PID namespaces.
      options: --privileged
    steps:
      - name: Install test tools in the disposable runner
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl gnupg openssl sudo cron util-linux iproute2 apache2 libapache2-mod-php8.2 nodejs sox libsox-fmt-all python3 python3-venv python3-cryptography python3-pil php-cli php-xml php-mbstring php-curl php-gd php-sqlite3 php-mysql php-intl php-zip
          useradd --system --home-dir /var/lib/asterisk --create-home --user-group asterisk
          mkdir -p /var/lib/asterisk /var/spool/asterisk /etc/asterisk
          touch /etc/freepbx.conf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Validate source and documentation
        run: bash tools/lint_source.sh
      - name: Exercise isolated behavior and failure recovery
        run: bash tools/run_isolated_tests.sh
      - name: Validate dependency inventory
        run: python3 tools/build_sbom.py --output /tmp/sls-sbom.cdx.json
