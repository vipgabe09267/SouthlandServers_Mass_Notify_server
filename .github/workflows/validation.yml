name: Validate PBX module
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: debian:12-slim
      # Required only for disposable test mount/network/PID namespaces.
      options: --privileged
    steps:
      - name: Install test tools in the disposable runner
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl wget gnupg openssl sudo cron util-linux iproute2 systemd tzdata logrotate apache2 libapache2-mod-php8.2 php8.2-fpm nodejs libjs-jquery sox libsox-fmt-all imagemagick fonts-dejavu-core postfix python3 python3-venv python3-pip python3-cryptography python3-pil python3-jsonschema php-cli php-xml php-mbstring php-curl php-gd php-sqlite3 php-mysql php-intl php-zip
          useradd --system --home-dir /var/lib/asterisk --create-home --user-group asterisk
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location -o /tmp/sangoma-key.asc https://deb.freepbx.org/gpg/aptly-pubkey.asc
          printf '%s\n' 'a34c0ec58e9f03b49ea6e36a914ee5b3a6f4063752945140ceb3c758029a5b14  /tmp/sangoma-key.asc' | sha256sum --check
          gpg --batch --dearmor --output /usr/share/keyrings/sls-ci-sangoma.gpg /tmp/sangoma-key.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/sls-ci-sangoma.gpg] https://deb.freepbx.org/freepbx17-prod bookworm main' > /etc/apt/sources.list.d/sls-ci-sangoma.list
          apt-get update
          apt-get install -y --no-install-recommends libedit2 libxslt1.1 liburiparser1 asterisk22-core=22.10.1-1.sng12 asterisk22-doc=22.10.1-1.sng12 asterisk22-voicemail=22.10.1-1.sng12
          asterisk -V
          mkdir -p /var/lib/asterisk /var/spool/asterisk /etc/asterisk /etc/sls-mass-notify /usr/local/bin/sls_mass_notify /var/www/html/admin/modules/slsmassnotifyserver /var/www/html/sls_mass_notify
          touch /etc/freepbx.conf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Validate source and documentation
        run: bash tools/lint_source.sh
      - name: Install pinned browser qualification tools
        run: |
          python3 -m venv /opt/sls-ui-venv
          /opt/sls-ui-venv/bin/pip install --require-hashes --only-binary=:all: -r tools/ui-qualification-requirements.txt
          PLAYWRIGHT_BROWSERS_PATH=/opt/sls-ui-browsers /opt/sls-ui-venv/bin/python -m playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH=/opt/sls-ui-browsers /opt/sls-ui-venv/bin/python - <<'PY'
          import os, pathlib, sysconfig
          from playwright.sync_api import sync_playwright
          with sync_playwright() as tools:
              browser=tools.chromium.executable_path
          jquery=pathlib.Path('/usr/share/javascript/jquery/jquery.min.js')
          if not jquery.is_file():
              raise SystemExit('The Debian jQuery browser fixture is missing; install libjs-jquery.')
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('SLS_UI_PYTHON_PATH='+sysconfig.get_paths()['purelib']+'\n')
              output.write('SLS_UI_CHROMIUM='+browser+'\nSLS_UI_REQUIRED=1\n')
              output.write('SLS_UI_JQUERY='+str(jquery)+'\n')
          PY
      - name: Exercise isolated behavior and failure recovery
        run: bash tools/run_isolated_tests.sh
      - name: Validate dependency inventory
        run: python3 tools/build_sbom.py --output /tmp/sls-sbom.cdx.json
      - name: Check inventoried dependencies against OSV
        run: python3 tools/check_dependencies.py
